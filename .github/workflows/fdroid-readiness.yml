name: F-Droid readiness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and build unsigned release APK
        run: ./gradlew clean testDebugUnitTest assembleRelease
