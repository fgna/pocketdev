name: Publish PocketDev v1.2.0

# One-time release gate. Only runs when the dedicated v1.2.0 changelog first
# lands on main; later releases require their own deliberate authorization.
on:
  push:
    branches:
      - main
    paths:
      - fastlane/metadata/android/en-US/changelogs/5.txt

permissions:
  contents: write

concurrency:
  group: pocketdev-release-1.2.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact main commit with tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release metadata and immutable tag availability
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ *versionCode = 5$' app/build.gradle.kts
          grep -Eq '^ *versionName = "1.2.0"$' app/build.gradle.kts
          grep -Eq '^CurrentVersion: 1.2.0$' fdroid/de.fgna.pocketdev.yml
          grep -Eq '^CurrentVersionCode: 5$' fdroid/de.fgna.pocketdev.yml
          grep -Eq '^    commit: v1.2.0$' fdroid/de.fgna.pocketdev.yml
          test -s fastlane/metadata/android/en-US/changelogs/5.txt
          if git ls-remote --exit-code --tags origin 'refs/tags/v1.2.0' >/dev/null; then
            echo "::error::Immutable v1.2.0 tag already exists; refusing to move it"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest assembleRelease
      - name: Create immutable annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.2.0 "$GITHUB_SHA" -m "PocketDev 1.2.0"
          git push origin refs/tags/v1.2.0
          gh release create v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "PocketDev 1.2.0" \
            --notes-file fastlane/metadata/android/en-US/changelogs/5.txt
