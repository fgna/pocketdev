name: Publish signed release APK

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-sign-publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build unsigned release APK
        run: ./gradlew clean testDebugUnitTest assembleRelease

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETDEV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocketdev-release.jks"
          chmod 600 "$RUNNER_TEMP/pocketdev-release.jks"

      - name: Align and sign APK
        id: sign
        env:
          STORE_PASSWORD: ${{ secrets.POCKETDEV_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.POCKETDEV_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKETDEV_RELEASE_KEY_ALIAS }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          VERSION="${TAG#v}"
          SIGNED_APK="PocketDev-${VERSION}.apk"

          test -f "$UNSIGNED_APK"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/pocketdev-release.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:STORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "$SIGNED_APK"             "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

          FINGERPRINT="$("$APKSIGNER" verify --print-certs "$SIGNED_APK" 2>/dev/null             | sed -n 's/^Signer #1 certificate SHA-256 digest: \(.*\)/\1/p')"
          test -n "$FINGERPRINT"

          {
            echo "### Release APK"
            echo
            echo "- Asset: `$SIGNED_APK`"
            echo "- Signing certificate SHA-256: `$FINGERPRINT`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.sign.outputs.apk }}
        run: gh release upload "$TAG" "$APK"
